<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Weather App</title>
</head>
<body>

<section class="hero min-vh-100 d-flex justify-content-center align-items-center bg-light">
  <div class="card text-dark shadow-lg p-4">
    <div class="searching d-flex justify-content-center mb-4">
      <input class="form-control border-3 w-50" type="text" placeholder="Enter city name">
      <button class="btn btn-primary ms-2 px-4">Search</button>
    </div>
    <div class="card-body text-center">
      <h1 class="temp fw-bold display-4">26°C</h1>
      <div class="image my-3">
        <img src="images/clouds.png" alt="Weather icon" class="img-fluid" style="width: 100px;">
      </div>
      <h2 class="city mb-4">New York</h2>
      <div class="details d-flex justify-content-around">
        <div class="d-flex align-items-center">
          <img src="images/humidity.png" alt="Humidity" class="me-2" style="width: 40px;">
          <div>
            <p class="humidity fw-bold mb-0">50%</p>
            <small>Humidity</small>
          </div>
        </div>
        <div class="d-flex align-items-center">
          <img src="images/wind.png" alt="Wind Speed" class="me-2" style="width: 40px;">
          <div>
            <p class="wind fw-bold mb-0">15 KM/HR</p>
            <small>Wind Speed</small>
          </div>
        </div>
      </div>
      <a href="#" class="btn btn-primary mt-4">Go somewhere</a>
    </div>
  </div>
</section>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>


<script>
  const apiKey = "f3588e8d4a508a58acd0f488917e0548";
  const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

  const searchBox= document.querySelector("input");
  const searchBtn= document.querySelector("button");
  const weatherIcon = document.querySelector(".img-fluid")

  async function checkWeather(city) {
  
      const response = await fetch(apiUrl +city+ `&appid=${apiKey}`);
  
      var data = await response.json();
        console.log(data)

        document.querySelector(".city").innerHTML=data.name
    document.querySelector(".temp").innerHTML=data.main.temp+"°C"
    document.querySelector(".humidity").innerHTML=data.main.humidity + "%";
    document.querySelector(".wind").innerHTML=data.wind.speed + "Km/hr";

    if(data.weather[0].main=="Cloud"){
      weatherIcon.src="images/clouds.png"
    }
    else if (data.weather[0].main=="Clear"){
      weatherIcon.src="images/clear.png"
    }
    else if(data.weather[0].main == "Rain"){
      weatherIcon.src="images/rain.png"
    }
    else if(data.weather[0].main == "Rain"){
      weatherIcon.src="images/rain.png"
    }
    else if(data.weather[0].main == "Drizzle"){
      weatherIcon.src="images/drizzle.png"
    }
    else if(data.weather[0].main == "Mist"){
      weatherIcon.src="images/mist.png"
    }
    document.querySelector(".card-body").style.display="block";
  
  }

  searchBtn.addEventListener("click",()=>{
    checkWeather(searchBox.value);
  })  

  

   // 🔹 Test with a city name
</script>
</body>
</html>
